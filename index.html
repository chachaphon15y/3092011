<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClipFetch – ตรวจสอบและดาวน์โหลดวิดีโอออนไลน์</title>
<meta name="description" content="วางลิงก์วิดีโอเพื่อตรวจสอบว่าดาวน์โหลดได้หรือไม่ รองรับเฉพาะกรณีที่ได้รับอนุญาต ไม่หลบเลี่ยง DRM หรือการล็อกอิน">
<style>
:root{--bg:#f6f5fb;--fg:#1b1930;--mut:#5d5a78;--card:#fff;--bd:#dcd9ee;--ac:#6d4aff;--acfg:#fff;--ok:#15803d;--er:#b91c1c;--wa:#b45309;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0e0c1b;--fg:#ecebfa;--mut:#a29fc4;--card:#181530;--bd:#2c2850;--ac:#8b72ff;--acfg:#0e0c1b;--ok:#4ade80;--er:#f87171;--wa:#fbbf24;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 system-ui,"Noto Sans Thai",sans-serif}
a{color:var(--ac)}.w{max-width:880px;margin:0 auto;padding:0 16px}
header{border-bottom:1px solid var(--bd)}.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0}
.logo{font-weight:800;font-size:1.3rem;text-decoration:none;color:var(--fg);margin-right:auto}.logo b{color:var(--ac)}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:10px;padding:10px 16px;text-decoration:none;display:inline-block}
.p{background:var(--ac);color:var(--acfg);border-color:var(--ac);font-weight:700}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
input{font:inherit;width:100%;padding:16px;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg);font-size:1.05rem}
.hero{text-align:center;padding:36px 0 12px}h1{font-size:clamp(1.7rem,5vw,2.6rem);line-height:1.2;margin:.2em 0}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;justify-content:center}.row>*{flex:1 1 150px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-top:14px;text-align:left}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mut{color:var(--mut);font-size:.92rem}.er{color:var(--er);font-weight:700}.ok{color:var(--ok);font-weight:700}.wa{color:var(--wa);font-weight:700}
.tag{font-size:.8rem;border:1px solid var(--bd);border-radius:99px;padding:1px 10px;white-space:nowrap}
table{width:100%;border-collapse:collapse}td{padding:8px 4px;border-bottom:1px solid var(--bd);vertical-align:top}
.ad{border:1px dashed var(--bd);border-radius:10px;padding:12px;text-align:center;color:var(--mut);font-size:.85rem;margin:28px 0}
details{border-bottom:1px solid var(--bd);padding:10px 0}summary{cursor:pointer;font-weight:600}
footer{border-top:1px solid var(--bd);margin-top:40px;padding:20px 0;color:var(--mut);font-size:.9rem}footer a{margin-right:12px}
</style>
</head>
<body>
<header><div class="w bar"><a class="logo" href="#home">▶ Clip<b>Fetch</b></a><button id="lg" type="button" aria-label="Language">TH/EN</button><button id="th" type="button" aria-label="Theme">🌓</button></div></header>
<main id="app" class="w" tabindex="-1"></main>
<footer><div class="w"><a href="#about">เกี่ยวกับเรา</a><a href="#contact">ติดต่อ</a><a href="#privacy">ความเป็นส่วนตัว</a><a href="#terms">ข้อกำหนด</a><a href="#copyright">ลิขสิทธิ์</a><a href="#sponsor">ผู้สนับสนุน</a><p>© ClipFetch — ใช้กับเนื้อหาที่คุณมีสิทธิ์เท่านั้น</p></div></footer>
<script>
// ===== ตั้งค่าผู้ดูแล =====
const CONFIG={
 contactEmail:"",        // อีเมลติดต่อจริง
 adsEnabled:false,       // true หลังได้รับอนุมัติโฆษณา + ติดตั้งระบบขอความยินยอมแล้ว
 resolverEndpoint:"",    // URL ของ backend ที่คุณสร้างเอง (ดูคู่มือ) — ว่าง = ยังไม่เชื่อมต่อ

const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const st={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let L=st.get("lang","th");
const D={th:{h:"ดาวน์โหลดวิดีโอออนไลน์",sub:"วางลิงก์เพื่อตรวจสอบว่าดาวน์โหลดได้หรือไม่ รองรับเฉพาะวิดีโอที่คุณมีสิทธิ์ ไม่หลบเลี่ยง DRM การล็อกอิน หรือข้อกำหนดของแพลตฟอร์ม",ph:"วางลิงก์วิดีโอที่นี่ (https://...)",paste:"วางลิงก์",chk:"ตรวจสอบวิดีโอ",busy:"กำลังตรวจสอบ…",empty:"กรุณาวางลิงก์วิดีโอก่อน",bad:"รูปแบบลิงก์ไม่ถูกต้อง ต้องขึ้นต้นด้วย http:// หรือ https://",priv:"ไม่รองรับลิงก์ที่ชี้ไปยังที่อยู่ภายในหรือ IP โดยตรง",wait:"กรุณารอสักครู่ก่อนตรวจสอบอีกครั้ง",pf:"แพลตฟอร์มที่ระบบรู้จัก",pfn:"สถานะการรองรับ",hw:"วิธีใช้งาน",faq:"คำถามที่พบบ่อย",art:"บทความ",open:"เปิดวิดีโอต้นฉบับ",dl:"ดาวน์โหลดไฟล์",unk:"ไม่ทราบ",ad:"พื้นที่สำรองสำหรับโฆษณา — ยังไม่เปิดใช้งาน"}
,en:{h:"Online Video Downloader",sub:"Paste a link to check whether it can be downloaded. Only content you have rights to; no DRM, login or platform-terms circumvention.",ph:"Paste video link here (https://...)",paste:"Paste Link",chk:"Check Video",busy:"Checking…",empty:"Please paste a video link first",bad:"Invalid link. It must start with http:// or https://",priv:"Links to internal addresses or raw IPs are not supported",wait:"Please wait a moment before checking again",pf:"Platforms we recognise",pfn:"Support status",hw:"How it works",faq:"FAQ",art:"Articles",open:"Open original video",dl:"Download file",unk:"unknown",ad:"Ad placeholder — not enabled"}};
const t=k=>D[L][k];
const PF=[["YouTube",/(^|\.)(youtube\.com|youtu\.be)$/],["TikTok",/(^|\.)tiktok\.com$/],["Facebook",/(^|\.)(facebook\.com|fb\.watch)$/],["Instagram",/(^|\.)instagram\.com$/],["Vimeo",/(^|\.)vimeo\.com$/]];
const GUIDE={YouTube:"หากเป็นวิดีโอของคุณเอง ดาวน์โหลดได้จาก YouTube Studio วิดีโอของผู้อื่นให้ใช้ตัวเลือกอย่างเป็นทางการของ YouTube (เช่น YouTube Premium สำหรับการบันทึกออฟไลน์ในแอป)",TikTok:"หากเป็นวิดีโอของคุณเอง ใช้ตัวเลือกบันทึกวิดีโอ/ดาวน์โหลดข้อมูลในแอป TikTok วิดีโอของผู้อื่นดาวน์โหลดได้เฉพาะเมื่อเจ้าของเปิดอนุญาต",Facebook:"หากเป็นเนื้อหาของคุณเอง ใช้เมนู \"ดาวน์โหลดข้อมูลของคุณ\" ใน Facebook",Instagram:"หากเป็นเนื้อหาของคุณเอง ใช้เมนู \"ดาวน์โหลดข้อมูลของคุณ\" ใน Instagram",Vimeo:"Vimeo แสดงปุ่มดาวน์โหลดบนหน้าวิดีโอเมื่อเจ้าของวิดีโออนุญาต โปรดเปิดหน้าต้นฉบับและตรวจสอบที่นั่น"};
const ERR={http:"เซิร์ฟเวอร์ปลายทางตอบกลับข้อผิดพลาด จึงยังไม่ยืนยันว่ามีไฟล์ให้ดาวน์โหลด",notvideo:"ปลายทางไม่ได้ระบุว่าเป็นไฟล์วิดีโอ (Content-Type ไม่ใช่ video/*)",timeout:"หมดเวลารอเซิร์ฟเวอร์ปลายทาง (8 วินาที)",cors:"เบราว์เซอร์เข้าถึงข้อมูลไฟล์นี้ไม่ได้ (ปลายทางไม่อนุญาตการตรวจสอบข้ามเว็บไซต์ หรือหน้าเว็บนี้ถูกจำกัดการเชื่อมต่อ) จึงยืนยันไม่ได้ว่าดาวน์โหลดได้"};
function parse(s){s=s.trim();if(!s)return{e:"empty"};let u;try{u=new URL(s)}catch(x){return{e:"bad"}}
 if(!/^https?:$/.test(u.protocol)||u.username||u.password)return{e:"bad"};const h=u.hostname.toLowerCase();
 if(h==="localhost"||/\.(local|internal|localdomain)$/.test(h)||/^[\d.]+$/.test(h)||h.includes(":")||h.startsWith("["))return{e:"priv"};return{u,h}}
async function probe(u){const c=new AbortController(),tm=setTimeout(()=>c.abort(),8000);try{const r=await fetch(u,{method:"HEAD",signal:c.signal,credentials:"omit",referrerPolicy:"no-referrer"});if(!r.ok)return{err:"http"};const ct=(r.headers.get("content-type")||"").split(";")[0],cl=r.headers.get("content-length");if(!ct.startsWith("video/"))return{err:"notvideo"};return{type:ct,size:cl?+cl:null}}catch(e){return{err:e.name==="AbortError"?"timeout":"cors"}}finally{clearTimeout(tm)}}
const fs=n=>n==null?t("unk"):n>1e9?(n/1e9).toFixed(2)+" GB":(n/1e6).toFixed(1)+" MB";
let last=0;
async function check(){const o=$("#res"),r=parse($("#u").value);
 if(r.e)return o.innerHTML=`<div class="card er" role="alert">${t(r.e)}</div>`;
 if(Date.now()-last<2000)return o.innerHTML=`<div class="card wa" role="alert">${t("wait")}</div>`;last=Date.now();
 const link=esc(r.u.href),pf=PF.find(p=>p[1].test(r.h));$("#go").disabled=true;$("#go").textContent=t("busy");o.innerHTML=`<div class="card" aria-live="polite">${t("busy")}</div>`;
 let h;
 if(pf){h=`<div class="card"><b>${pf[0]}</b> <span class="tag">ยังไม่เชื่อมต่อ</span><p class="wa">ระบบยังไม่สามารถดาวน์โหลดจากแพลตฟอร์มนี้ผ่านเว็บไซต์ได้</p><p>${CONFIG.resolverEndpoint?"มีการตั้งค่า resolver แต่โค้ดฝั่งเบราว์เซอร์นี้ยังไม่ได้เชื่อมต่อกับ API ที่ทดสอบแล้ว":"ยังไม่ได้เชื่อมต่อ API/แหล่งข้อมูลที่ได้รับอนุญาต จึงไม่มีข้อมูลตัวอย่าง ความละเอียด หรือไฟล์ให้แสดง"}</p><p class="mut">ทางเลือกที่ได้รับอนุญาต: ${GUIDE[pf[0]]}</p><a class="btn p" href="${link}" target="_blank" rel="noopener noreferrer">${t("open")}</a></div>`}
 else if(/\.(mp4|webm|mov|m4v|ogv)$/i.test(r.u.pathname)){const p=await probe(r.u.href);
  h=p.err?`<div class="card"><b>ไฟล์วิดีโอโดยตรง</b><p class="wa">${ERR[p.err]}</p><a class="btn" href="${link}" target="_blank" rel="noopener noreferrer">${t("open")}</a></div>`
  :`<div class="card"><b>ไฟล์วิดีโอโดยตรง</b> <span class="tag">${esc(r.h)}</span><p class="ok">พบไฟล์วิดีโอ</p><table><tr><td>รูปแบบ</td><td>${esc(p.type)}</td></tr><tr><td>ขนาด</td><td>${fs(p.size)}</td></tr></table><p class="mut">ดาวน์โหลดเฉพาะไฟล์ที่เจ้าของอนุญาตให้ใช้</p><a class="btn p" href="${link}" download target="_blank" rel="noopener noreferrer">${t("dl")}</a></div>`}
 else h=`<div class="card"><p class="wa">ไม่รู้จักแพลตฟอร์มนี้ และลิงก์ไม่ใช่ไฟล์วิดีโอโดยตรง (.mp4/.webm/.mov/.m4v/.ogv) จึงยังไม่รองรับ</p><a class="btn" href="${link}" target="_blank" rel="noopener noreferrer">${t("open")}</a></div>`;
 o.innerHTML=h;$("#go").disabled=false;$("#go").textContent=t("chk")}
const ad=()=>`<div class="ad" role="complementary" aria-label="ad">${CONFIG.adsEnabled?"Ad slot":t("ad")}</div>`;
const STAT=[["YouTube","ยังไม่เชื่อมต่อ/ยังไม่ทดสอบ — แสดงลิงก์ต้นฉบับและวิธีทางการ"],["TikTok","ยังไม่เชื่อมต่อ/ยังไม่ทดสอบ"],["Facebook","ยังไม่เชื่อมต่อ/ยังไม่ทดสอบ"],["Instagram","ยังไม่เชื่อมต่อ/ยังไม่ทดสอบ"],["Vimeo","ยังไม่เชื่อมต่อ/ยังไม่ทดสอบ"],["ไฟล์วิดีโอโดยตรง","ตรวจสอบได้ หากเซิร์ฟเวอร์ปลายทางอนุญาต CORS (ยังไม่ได้ทดสอบกับลิงก์จริงของคุณ)"]];
const FAQ=[["ClipFetch ดาวน์โหลดวิดีโอจากทุกเว็บได้ไหม","ไม่ได้ เรารองรับเฉพาะกรณีที่ได้รับอนุญาต และจะไม่อ้างว่ารองรับแพลตฟอร์มใดจนกว่าจะเชื่อมต่อและทดสอบสำเร็จจริง"],["ทำไมบางลิงก์ดาวน์โหลดไม่ได้","เพราะอาจเป็นวิดีโอส่วนตัว มี DRM ต้องล็อกอิน หรือแพลตฟอร์มไม่อนุญาตตามข้อกำหนด เราไม่หลบเลี่ยงสิ่งเหล่านี้"],["ลิงก์ที่วางถูกเก็บไหม","เวอร์ชันนี้ตรวจสอบในเบราว์เซอร์ และไม่ส่งลิงก์ไปเซิร์ฟเวอร์ของเรา"],["ใช้ดาวน์โหลดวิดีโอคนอื่นได้ไหม","เฉพาะเมื่อเจ้าของอนุญาต เช่น ไลเซนส์เปิด ตรวจสอบสิทธิ์ก่อนเสมอ"]];
function home(){const v=$("#u")?$("#u").value:"";const a=$("#app");
a.innerHTML=`<section class="hero"><h1>${t("h")}</h1><p class="mut">${t("sub")}</p><label for="u" class="mut" style="display:block;text-align:left">URL</label><input id="u" type="url" inputmode="url" autocomplete="off" placeholder="${t("ph")}"><div class="row"><button id="ps" type="button">${t("paste")}</button><button id="go" class="p" type="button">${t("chk")}</button></div><div id="res" aria-live="polite"></div></section>
<h2>${t("pf")}</h2><div class="card"><table><tr><td><b>แพลตฟอร์ม</b></td><td><b>${t("pfn")}</b></td></tr>${STAT.map(s=>`<tr><td>${s[0]}</td><td>${s[1]}</td></tr>`).join("")}</table></div>
<h2>${t("hw")}</h2><div class="grid"><div class="card"><b>1. วางลิงก์</b><p class="mut">คัดลอกลิงก์วิดีโอที่คุณมีสิทธิ์ใช้งาน</p></div><div class="card"><b>2. ตรวจสอบ</b><p class="mut">ระบบตรวจรูปแบบลิงก์และแหล่งที่มา</p></div><div class="card"><b>3. ดาวน์โหลดหรือเปิดต้นฉบับ</b><p class="mut">ปุ่มดาวน์โหลดจะขึ้นเมื่อมีไฟล์จริงเท่านั้น</p></div></div>
<h2>${t("faq")}</h2>${FAQ.map(f=>`<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join("")}
<h2>${t("art")}</h2><a class="card" style="display:block;text-decoration:none;color:inherit" href="#article"><b>ดาวน์โหลดวิดีโออย่างถูกต้องตามกฎหมาย</b><br><span class="mut">ต้องรู้อะไรบ้างก่อนบันทึกวิดีโอ</span></a>
${CONFIG.affiliates.filter(x=>x.active&&/^https:\/\//.test(x.url)).length?`<h2>แนะนำ <span class="tag">มีลิงก์ Affiliate</span></h2><div class="grid">${CONFIG.affiliates.filter(x=>x.active&&/^https:\/\//.test(x.url)).map(x=>`<div class="card"><b>${esc(x.name)}</b><p class="mut">${esc(x.desc||"")}</p><a href="${esc(x.url)}" rel="sponsored noopener" target="_blank">ดูรายละเอียด</a></div>`).join("")}</div><p class="mut">เราอาจได้รับค่าคอมมิชชันจากลิงก์เหล่านี้</p>`:""}
${ad()}`;
$("#u").value=v;$("#go").onclick=check;$("#u").onkeydown=e=>{if(e.key==="Enter")check()};
$("#ps").onclick=async()=>{try{$("#u").value=(await navigator.clipboard.readText()).trim()}catch(e){$("#res").innerHTML=`<div class="card wa" role="alert">เบราว์เซอร์ไม่อนุญาตให้อ่านคลิปบอร์ด กรุณากดวางด้วยตนเอง</div>`;$("#u").focus()}}}
const P={about:["เกี่ยวกับเรา","<p>ClipFetch ช่วยตรวจสอบว่าลิงก์วิดีโอมีวิธีดาวน์โหลดที่ได้รับอนุญาตหรือไม่ เราไม่หลบเลี่ยง DRM ระบบล็อกอิน หรือข้อกำหนดของแพลตฟอร์ม</p>"],
privacy:["นโยบายความเป็นส่วนตัว","<p>เวอร์ชันนี้ลิงก์ที่คุณวางถูกตรวจสอบในเบราว์เซอร์ และไม่ถูกส่งหรือบันทึกที่เซิร์ฟเวอร์ของเรา ยกเว้นเมื่อคุณตรวจสอบไฟล์โดยตรง ซึ่งเบราว์เซอร์ของคุณจะเชื่อมต่อไปยังเซิร์ฟเวอร์ปลายทางของลิงก์นั้นเอง</p><p>เก็บในเครื่องคุณเฉพาะธีมและภาษา ยังไม่มีคุกกี้ Analytics หรือโฆษณา หากเปิดใช้ในอนาคตจะอัปเดตนโยบายและขอความยินยอมก่อน</p>"],
terms:["ข้อกำหนดการใช้งาน","<p>คุณต้องใช้บริการกับเนื้อหาที่คุณเป็นเจ้าของหรือได้รับอนุญาตเท่านั้น และรับผิดชอบการปฏิบัติตามกฎหมายลิขสิทธิ์และข้อกำหนดของแพลตฟอร์มต้นทาง บริการให้ตามสภาพ ไม่รับประกันว่าลิงก์ใดจะดาวน์โหลดได้</p>"],
copyright:["นโยบายลิขสิทธิ์","<p>เราเคารพลิขสิทธิ์ ClipFetch ไม่จัดเก็บหรือโฮสต์วิดีโอของผู้ใช้ หากพบการใช้งานที่ละเมิดสิทธิ์ของคุณ โปรดติดต่อเราตามหน้าติดต่อพร้อมรายละเอียดเพื่อตรวจสอบ</p>"],
article:["ดาวน์โหลดวิดีโออย่างถูกต้องตามกฎหมาย","<p>ก่อนบันทึกวิดีโอ ให้ตรวจสอบสามเรื่อง: ใครเป็นเจ้าของ เจ้าของอนุญาตหรือไม่ (เช่น ไลเซนส์ Creative Commons หรือปุ่มดาวน์โหลดทางการ) และข้อกำหนดของแพลตฟอร์ม</p><p>วิดีโอของคุณเองมักดาวน์โหลดได้ผ่านเครื่องมือทางการของแพลตฟอร์ม ส่วนวิดีโอของผู้อื่น แม้เปิดดูฟรี ก็ไม่ได้แปลว่าอนุญาตให้ดาวน์โหลดหรือเผยแพร่ซ้ำ</p>"]};
function page(h){const a=$("#app");
 if(h==="contact")return a.innerHTML=`<h1>ติดต่อเรา</h1>`+(CONFIG.contactEmail?`<p><a href="mailto:${esc(CONFIG.contactEmail)}">${esc(CONFIG.contactEmail)}</a></p>`:`<p class="er">ผู้ดูแลยังไม่ได้ตั้งค่าอีเมลติดต่อ (CONFIG.contactEmail)</p>`);
 if(h==="sponsor")return a.innerHTML=`<h1>ผู้สนับสนุนและโฆษณา</h1><p>สนใจประชาสัมพันธ์ เนื้อหาสปอนเซอร์จะมีป้าย "ได้รับการสนับสนุน" ชัดเจน</p><p class="mut">ขณะนี้ยังไม่มีผู้สนับสนุน และยังไม่เปิดบริการ Premium (${CONFIG.premiumOpen?"เปิด":"ปิด"})</p>`+(CONFIG.contactEmail?`<p><a href="mailto:${esc(CONFIG.contactEmail)}">${esc(CONFIG.contactEmail)}</a></p>`:`<p class="er">ยังไม่ได้ตั้งค่าอีเมลติดต่อ</p>`);
 if(P[h]){document.title=P[h][0]+" | ClipFetch";return a.innerHTML=`<h1>${P[h][0]}</h1>${P[h][1]}${h==="article"?ad():""}`}
 a.innerHTML=`<h1>ไม่พบหน้านี้</h1><p><a href="#home">กลับหน้าแรก</a></p>`}
function route(){const h=(location.hash||"#home").slice(1);if(h==="home"){document.title="ClipFetch – ตรวจสอบและดาวน์โหลดวิดีโอออนไลน์";home()}else page(h);scrollTo(0,0)}
$("#th").onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==="dark"?"light":"dark";st.set("theme",r.dataset.theme)};
$("#lg").onclick=()=>{L=L==="th"?"en":"th";st.set("lang",L);document.documentElement.lang=L;route()};
document.documentElement.dataset.theme=st.get("theme","dark");document.documentElement.lang=L;
addEventListener("hashchange",route);route();
</script>
